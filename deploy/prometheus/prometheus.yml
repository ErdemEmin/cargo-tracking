global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Flask API metrikleri (/cargo istekleri ve kargo islemleri)
  - job_name: cargo-api
    metrics_path: /metrics
    static_configs:
      - targets: ["flask:5000"]
        labels:
          service: cargo-api

  # Kafka Consumer metrikleri (event isleme sayaclari)
  - job_name: cargo-consumer
    metrics_path: /metrics
    static_configs:
      - targets: ["consumer:9091"]
        labels:
          service: cargo-consumer
